<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#111315">
  <title>TCP Optimiser</title>
  <script>
    (() => {
      const mode = localStorage.getItem('tcp_themeMode') || 'auto';
      const resolved = mode === 'auto'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : mode;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
  <link rel="stylesheet" href="css/v41.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="brand-mark">T</span>
        <div>
          <strong id="shell-title">TCP Optimiser</strong>
          <small>v4.1 WebUI</small>
        </div>
      </div>
      <span id="shell-status" class="status" data-ok="true">…</span>
    </header>

    <main id="app-outlet" aria-live="polite">
      <section class="page"><div class="skeleton hero-skeleton"></div><div class="metric-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-btn active" data-page="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-btn" data-page="stats"><span>⌁</span><small>Stats</small></button>
      <button class="nav-btn" data-page="settings"><span>≡</span><small>Settings</small></button>
      <button class="nav-btn" data-page="logs"><span>≣</span><small>Logs</small></button>
    </nav>
  </div>

  <script type="module" src="js/v41/app.js"></script>
</body>
</html>
