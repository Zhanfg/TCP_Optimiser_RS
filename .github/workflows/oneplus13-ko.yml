name: OnePlus 13 PJZ110 KO

on:
  workflow_dispatch:
  push:
    branches:
      - 'device/oneplus13-pjz110-ko'
    paths:
      - 'src/kernel_module.rs'
      - 'scripts/build-oneplus13-kos.sh'
      - 'scripts/verify-device-symvers.py'
      - 'scripts/device-profiles/oneplus13-pjz110.json'
      - '.github/workflows/oneplus13-ko.yml'

concurrency:
  group: oneplus13-pjz110-ko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build PJZ110 KO-only bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu bison build-essential ccache clang-18 flex git \
            kmod libelf-dev libssl-dev lld-18 llvm-18 pahole python3 rsync

      - id: symvers_cache
        name: Restore verified PJZ110 symvers
        uses: actions/cache/restore@v6
        with:
          path: .oneplus13-symvers-cache
          key: oneplus13-pjz110-symvers-v2-e1b346b6-${{ hashFiles('scripts/device-profiles/oneplus13-pjz110.json') }}

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache-oneplus13
          key: oneplus13-pjz110-ccache-v1-e1b346b6-clang18
          restore-keys: |
            oneplus13-pjz110-ccache-v1-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir="$HOME/.cache/ccache-oneplus13"
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Build and verify against live-device CRC fingerprint
        env:
          TCP_OPTIMISER_SYMVERS_CACHE: ${{ github.workspace }}/.oneplus13-symvers-cache
          CCACHE_DIR: ${{ runner.temp }}/unused
        run: |
          set -o pipefail
          bash scripts/build-oneplus13-kos.sh oneplus13_kernel_modules \
            2>&1 | tee oneplus13-ko-build.log

      - name: Save verified PJZ110 symvers
        if: ${{ always() && steps.symvers_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .oneplus13-symvers-cache
          key: oneplus13-pjz110-symvers-v2-e1b346b6-${{ hashFiles('scripts/device-profiles/oneplus13-pjz110.json') }}

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Verify output
        run: |
          test -s oneplus13_kernel_modules/manifest.json
          test -s oneplus13_kernel_modules/device_profile/abi-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("oneplus13_kernel_modules")
          report=json.loads((root/"device_profile/abi-report.json").read_text())
          if not report.get("compatible") or report.get("matched") != 65:
              raise SystemExit(f"live-device ABI gate failed: {report}")
          manifest=json.loads((root/"manifest.json").read_text())
          expected={"tcp_bbr3","sch_cake","sch_pie","sch_fq_pie"}
          actual={m["name"] for m in manifest["modules"]}
          if actual != expected:
              raise SystemExit(f"unexpected module set: {actual}")
          if any(m.get("kernel_release") is not None for m in manifest["modules"]):
              raise SystemExit("PJZ110 modules must be KMI-scoped, not exact-release scoped")
          print("PJZ110 ABI gate: 65/65 matched")
          print("modules:", ", ".join(sorted(actual)))
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oneplus13-pjz110-ko-build-log
          path: oneplus13-ko-build.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: oneplus13-pjz110-kos
          path: oneplus13_kernel_modules
          if-no-files-found: error
          retention-days: 30
