name: OnePlus 13 PJZ110 Flashable

on:
  workflow_dispatch:
  push:
    branches:
      - 'device/oneplus13-pjz110-ko'
    paths:
      - 'src/**'
      - 'webroot/**'
      - 'build.rs'
      - 'customize.sh'
      - 'service.sh'
      - 'post-fs-data.sh'
      - 'scripts/package-module.sh'
      - 'scripts/validate-package.sh'
      - 'scripts/build-oneplus13-kos.sh'
      - 'scripts/bbr3-o13-runtime.h'
      - 'scripts/verify-device-symvers.py'
      - 'scripts/device-profiles/oneplus13-pjz110.json'
      - 'scripts/device-profiles/oneplus13-pjz110.env'
      - '.github/workflows/oneplus13-ko.yml'

concurrency:
  group: oneplus13-pjz110-ko-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  build:
    name: Build PJZ110 flashable bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - id: kernel_cache_key
        name: Resolve PJZ110 kernel cache key
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          profile = json.loads(Path("scripts/device-profiles/oneplus13-pjz110.json").read_text())
          stable = {
              "source_revision": profile["source_revision"],
              "target_kmi": profile["target_kmi"],
              "page_size": profile["page_size"],
              "reference_crcs": profile["reference_crcs"],
          }
          abi = hashlib.sha256(
              json.dumps(stable, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()[:24]

          ko = hashlib.sha256()
          ko.update(abi.encode())
          for name in (
              "scripts/build-oneplus13-kos.sh",
              "scripts/bbr3-o13-runtime.h",
              "scripts/verify-device-symvers.py",
          ):
              ko.update(Path(name).read_bytes())

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"abi_key={abi}", file=out)
              print(f"ko_key={ko.hexdigest()[:24]}", file=out)
              print(f"source_rev={profile['source_revision']}", file=out)
          PY

      - id: ko_cache
        name: Restore verified PJZ110 KO bundle
        uses: actions/cache/restore@v6
        with:
          path: oneplus13_kernel_modules
          key: oneplus13-pjz110-kos-v1-${{ steps.kernel_cache_key.outputs.ko_key }}

      - id: source_cache
        name: Restore pinned OnePlus OSS source
        if: steps.ko_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .oneplus13-source-cache
          key: oneplus13-pjz110-source-v1-${{ steps.kernel_cache_key.outputs.source_rev }}

      - name: Populate pinned OnePlus OSS source cache
        if: steps.ko_cache.outputs.cache-hit != 'true' && steps.source_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SOURCE_REV: ${{ steps.kernel_cache_key.outputs.source_rev }}
        run: |
          rm -rf .oneplus13-source-cache
          git init .oneplus13-source-cache
          git -C .oneplus13-source-cache remote add origin \
            https://github.com/OnePlusOSS/android_kernel_common_oneplus_sm8750.git
          git -C .oneplus13-source-cache fetch --depth=1 origin "$SOURCE_REV"
          git -C .oneplus13-source-cache checkout --detach FETCH_HEAD
          test "$(git -C .oneplus13-source-cache rev-parse HEAD)" = "$SOURCE_REV"

      - name: Save pinned OnePlus OSS source cache
        if: steps.ko_cache.outputs.cache-hit != 'true' && steps.source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .oneplus13-source-cache
          key: oneplus13-pjz110-source-v1-${{ steps.kernel_cache_key.outputs.source_rev }}

      - name: Install kernel build dependencies
        if: steps.ko_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils-aarch64-linux-gnu bison build-essential ccache clang-18 flex git \
            kmod libelf-dev libssl-dev lld-18 llvm-18 pahole python3 rsync

      - id: symvers_cache
        name: Restore verified PJZ110 symvers
        if: steps.ko_cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .oneplus13-symvers-cache
          key: oneplus13-pjz110-symvers-v3-${{ steps.kernel_cache_key.outputs.source_rev }}-${{ steps.kernel_cache_key.outputs.abi_key }}

      - name: Restore compiler cache
        if: steps.ko_cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache-oneplus13
          key: oneplus13-pjz110-ccache-v1-e1b346b6-clang18
          restore-keys: |
            oneplus13-pjz110-ccache-v1-

      - name: Configure ccache
        if: steps.ko_cache.outputs.cache-hit != 'true'
        run: |
          ccache --set-config=cache_dir="$HOME/.cache/ccache-oneplus13"
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Build and verify against live-device CRC fingerprint
        if: steps.ko_cache.outputs.cache-hit != 'true'
        env:
          TCP_OPTIMISER_SYMVERS_CACHE: ${{ github.workspace }}/.oneplus13-symvers-cache
          TCP_OPTIMISER_KERNEL_SOURCE_CACHE: ${{ github.workspace }}/.oneplus13-source-cache
        run: |
          set -o pipefail
          bash scripts/build-oneplus13-kos.sh oneplus13_kernel_modules \
            2>&1 | tee oneplus13-ko-build.log

      - name: Save verified PJZ110 symvers
        if: ${{ steps.ko_cache.outputs.cache-hit != 'true' && always() && steps.symvers_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: .oneplus13-symvers-cache
          key: oneplus13-pjz110-symvers-v3-${{ steps.kernel_cache_key.outputs.source_rev }}-${{ steps.kernel_cache_key.outputs.abi_key }}

      - name: Show compiler cache stats
        if: steps.ko_cache.outputs.cache-hit != 'true' && always()
        run: ccache --show-stats || true

      - name: Save verified PJZ110 KO bundle
        if: steps.ko_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: oneplus13_kernel_modules
          key: oneplus13-pjz110-kos-v1-${{ steps.kernel_cache_key.outputs.ko_key }}

      - name: Verify output
        run: |
          test -s oneplus13_kernel_modules/manifest.json
          test -s oneplus13_kernel_modules/device_profile/abi-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("oneplus13_kernel_modules")
          report=json.loads((root/"device_profile/abi-report.json").read_text())
          if not report.get("compatible") or report.get("matched") != 65:
              raise SystemExit(f"live-device ABI gate failed: {report}")
          manifest=json.loads((root/"manifest.json").read_text())
          expected={"tcp_bbr3","sch_cake","sch_pie","sch_fq_pie"}
          actual={m["name"] for m in manifest["modules"]}
          if actual != expected:
              raise SystemExit(f"unexpected module set: {actual}")
          if any(m.get("kernel_release") is not None for m in manifest["modules"]):
              raise SystemExit("PJZ110 modules must be KMI-scoped, not exact-release scoped")
          print("PJZ110 ABI gate: 65/65 matched")
          print("modules:", ", ".join(sorted(actual)))
          PY

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: oneplus13-pjz110-ko-build-log
          path: oneplus13-ko-build.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: oneplus13-pjz110-kos
          path: oneplus13_kernel_modules
          if-no-files-found: error
          retention-days: 30

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Restore Android Rust cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/aarch64-linux-android
          key: ${{ runner.os }}-pjz110-rust-arm64-${{ hashFiles('Cargo.lock') }}

      - name: Select pinned Android NDK
        shell: bash
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$NDK_HOME" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Validate Rust and WebUI source
        run: |
          cargo test --all-targets --locked
          cargo fmt --all -- --check
          for js in webroot/js/*.js; do
            node --check "$js"
          done

      - name: Build PJZ110 arm64 runtime
        env:
          TCP_OPTIMISER_OFFICIAL_BUILD: '1'
          TCP_OPTIMISER_BUILD_REPOSITORY: ${{ github.repository }}
          TCP_OPTIMISER_BUILD_REVISION: ${{ github.sha }}
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/_/TCP_Optimiser_RS -C debuginfo=0
        run: |
          cargo build --release --locked --target aarch64-linux-android
          binary="target/aarch64-linux-android/release/tcp_optimiser"
          test -s "$binary"
          llvm-strip --strip-all "$binary"
          install -Dm755 "$binary" binary-input/bin/arm64-v8a/tcp_optimiser
          readelf -h "$binary" | grep -F 'Machine:' | grep -F 'AArch64'

      - id: package_meta
        name: Resolve PJZ110 package metadata
        run: |
          version=$(sed -n 's/^version=//p' module.prop | head -n1)
          test -n "$version"
          echo "zip=TCP_Optimiser_RS-v${version}-PJZ110-test.zip" >> "$GITHUB_OUTPUT"
          echo "artifact=TCP_Optimiser_RS-v${version}-PJZ110-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build signed PJZ110 flashable ZIP
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
          TCP_OPTIMISER_PACKAGE_ABIS: arm64-v8a
          TCP_OPTIMISER_DEVICE_PROFILE_FILE: ${{ github.workspace }}/scripts/device-profiles/oneplus13-pjz110.env
        run: |
          rm -rf kernel_modules dist
          cp -a oneplus13_kernel_modules kernel_modules
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          bash scripts/package-module.sh "dist/${{ steps.package_meta.outputs.zip }}" binary-input/bin
          bash scripts/validate-package.sh "dist/${{ steps.package_meta.outputs.zip }}"
          (cd dist && sha256sum "${{ steps.package_meta.outputs.zip }}" > "${{ steps.package_meta.outputs.zip }}.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package_meta.outputs.artifact }}
          path: |
            dist/${{ steps.package_meta.outputs.zip }}
            dist/${{ steps.package_meta.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 30
