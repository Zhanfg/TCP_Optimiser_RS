name: Kernel pipeline smoke

on:
  pull_request:
    paths:
      - 'scripts/build-kernel-modules.sh'
      - 'scripts/kernel-module-config.txt'
      - 'scripts/audit-gki-symbols.py'
      - '.github/workflows/kernel-pipeline-smoke.yml'
  workflow_dispatch:

concurrency:
  group: kernel-pipeline-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kmi-preflight:
    name: Fast KMI preflight (android15-6.6)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - id: cache_key
        name: Resolve KMI cache key
        shell: bash
        run: |
          set -euo pipefail
          kernel_rev=$(git ls-remote https://android.googlesource.com/kernel/common "refs/heads/android15-6.6" | awk 'NR==1{print $1}')
          test -n "$kernel_rev"
          clang_id=$(clang --version | head -1 | sha256sum | awk '{print $1}')
          echo "kernel_rev=$kernel_rev" >> "$GITHUB_OUTPUT"
          echo "clang_id=$clang_id" >> "$GITHUB_OUTPUT"

      - id: preflight_cache
        name: Restore KMI compatibility result
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.kmi-preflight/android15-6.6
          key: ${{ runner.os }}-kmi-preflight-v2-android15-6.6-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt', 'scripts/build-kernel-modules.sh', 'scripts/audit-gki-symbols.py') }}
          save-always: true

      - name: Reuse cached rejection
        if: steps.preflight_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/.kmi-preflight/android15-6.6/report.json"
          test -s "$report"
          cp "$report" "$GITHUB_WORKSPACE/preflight-report.json"
          python3 - "$report" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          bad = [m for m in data["modules"] if not m["compatible"]]
          print(f"cached checked={len(data['modules'])} incompatible={len(bad)}")
          if not bad:
              raise SystemExit("smoke expects the current 6.6 bundle to be rejected")
          PY
          echo "warm_preflight_cache=true" >> "$GITHUB_STEP_SUMMARY"

      - name: Install minimal kernel build dependencies
        if: steps.preflight_cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            bison build-essential ccache clang flex git kmod libelf-dev libssl-dev \
            lld llvm pahole python3 rsync

      - name: Run fail-fast KMI preflight
        if: steps.preflight_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/preflight-report.json"
          start=$(date +%s)
          set +e
          TCP_OPTIMISER_PREFLIGHT_ONLY=1 \
          TCP_OPTIMISER_PREFLIGHT_REPORT="$report" \
          TCP_OPTIMISER_PREFLIGHT_CACHE="$GITHUB_WORKSPACE/.kmi-preflight/android15-6.6/report.json" \
          bash scripts/build-kernel-modules.sh android15-6.6 kernel_modules
          rc=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          echo "preflight_seconds=$elapsed" >> "$GITHUB_STEP_SUMMARY"
          echo "preflight_exit=$rc" >> "$GITHUB_STEP_SUMMARY"
          test -s "$report"
          python3 - "$report" <<'PY'
          import json
          import sys
          data = json.load(open(sys.argv[1]))
          bad = [m for m in data["modules"] if not m["compatible"]]
          print(f"checked={len(data['modules'])} incompatible={len(bad)}")
          for item in bad:
              print(item["file"], ", ".join(item["non_kmi_symbols"]))
          PY
          # The current bundle is known to contain non-KMI imports on stock 6.6.
          # That is a successful fail-fast result, not a smoke-test failure.
          if [ "$rc" -ne 0 ]; then
            echo "KMI rejection happened before the expensive full GKI build, as intended."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-kmi-preflight-android15-6.6
          path: preflight-report.json
          if-no-files-found: error
          retention-days: 7
