name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('Cargo.lock') }}

      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: Validate WebUI and release metadata
        run: |
          find webroot/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/validate-webui.mjs
          node scripts/validate-release.mjs
          python3 -m py_compile scripts/merge-kernel-modules.py scripts/audit-gki-symbols.py scripts/audit-module-exports.py

      - name: Validate module scripts
        run: |
          bash -n customize.sh post-fs-data.sh service.sh uninstall.sh scripts/package-module.sh scripts/validate-package.sh scripts/build-kernel-modules.sh
          shellcheck customize.sh post-fs-data.sh service.sh uninstall.sh scripts/package-module.sh scripts/validate-package.sh scripts/build-kernel-modules.sh

  build-android:
    name: Build ${{ matrix.abi }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            machine: AArch64
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            machine: ARM
          - target: x86_64-linux-android
            abi: x86_64
            machine: X86-64
    env:
      TCP_OPTIMISER_OFFICIAL_BUILD: '1'
      TCP_OPTIMISER_BUILD_REPOSITORY: ${{ github.repository }}
      TCP_OPTIMISER_BUILD_REVISION: ${{ github.sha }}
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/_/TCP_Optimiser_RS -C debuginfo=0
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Select pinned Android NDK
        shell: bash
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$NDK_HOME" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Verify Android ELF
        run: |
          binary="target/${{ matrix.target }}/release/tcp_optimiser"
          test -s "$binary"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all "$binary"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$binary" | tee elf-header.txt
          grep -F "Machine:" elf-header.txt | grep -F "${{ matrix.machine }}"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings" "$binary" | grep -F "https://github.com/${GITHUB_REPOSITORY}"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings" "$binary" | grep -F "$GITHUB_SHA"
          install -Dm755 "$binary" "artifact/bin/${{ matrix.abi }}/tcp_optimiser"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.abi }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  build-kernel-modules:
    name: Kernel modules ${{ matrix.kmi }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1024M
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.15
          - android14-6.1
          - android15-6.6
    steps:
      - uses: actions/checkout@v7

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            bison build-essential ccache clang flex git kmod libelf-dev libssl-dev \
            lld llvm pahole python3 rsync

      - id: cache_key
        name: Resolve compiler cache key
        shell: bash
        run: |
          set -euo pipefail
          kernel_rev=$(git ls-remote https://android.googlesource.com/kernel/common "refs/heads/${{ matrix.kmi }}" | awk 'NR==1{print $1}')
          test -n "$kernel_rev"
          clang_id=$(clang --version | head -1 | sha256sum | awk '{print $1}')
          echo "kernel_rev=$kernel_rev" >> "$GITHUB_OUTPUT"
          echo "clang_id=$clang_id" >> "$GITHUB_OUTPUT"

      - name: Restore exact GKI Module.symvers
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.kernel-symvers/${{ matrix.kmi }}
          key: ${{ runner.os }}-gki-symvers-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt') }}
          save-always: true

      - name: Restore kernel compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/build-kernel-modules.sh') }}
          restore-keys: |
            ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-
            ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-
          save-always: true

      - name: Configure ccache
        run: |
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config compression=true
          ccache --zero-stats

      - name: Build loadable GKI modules
        env:
          KERNEL_SYMVERS_CACHE: ${{ github.workspace }}/.kernel-symvers/${{ matrix.kmi }}/Module.symvers
        run: bash scripts/build-kernel-modules.sh "${{ matrix.kmi }}" kernel_modules

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Verify generated bundle
        run: |
          test -s kernel_modules/manifest.json
          test "$(find kernel_modules -name '*.ko' | wc -l)" -ge 8
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("kernel_modules")
          data = json.loads((root / "manifest.json").read_text())
          for entry in data["modules"]:
              path = root / entry["file"]
              if not path.is_file():
                  raise SystemExit(f"missing module: {entry['file']}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"hash mismatch: {entry['file']}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-modules-${{ matrix.kmi }}-arm64
          path: kernel_modules
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble module
    if: ${{ always() && github.event_name != 'pull_request' && needs.validate.result == 'success' && needs.build-android.result == 'success' && (needs.build-kernel-modules.result == 'success' || needs.build-kernel-modules.result == 'skipped') }}
    needs: [validate, build-android, build-kernel-modules]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binary-input
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: needs.build-kernel-modules.result == 'success'
        with:
          pattern: kernel-modules-*
          path: kernel-module-input

      - name: Merge kernel module bundles
        if: needs.build-kernel-modules.result == 'success'
        run: |
          rm -rf kernel_modules
          python3 scripts/merge-kernel-modules.py kernel-module-input kernel_modules
          test -s kernel_modules/manifest.json
          test "$(find kernel_modules -name '*.ko' | wc -l)" -ge 32

      - id: metadata
        name: Resolve package metadata
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' module.prop | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_name=TCP_Optimiser_RS-v$version.zip" >> "$GITHUB_OUTPUT"
          echo "artifact_name=TCP_Optimiser_RS-v$version-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build reproducible module ZIP
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          bash scripts/package-module.sh "dist/${{ steps.metadata.outputs.zip_name }}" binary-input/bin
          bash scripts/validate-package.sh "dist/${{ steps.metadata.outputs.zip_name }}"
          cd dist
          sha256sum "${{ steps.metadata.outputs.zip_name }}" > "${{ steps.metadata.outputs.zip_name }}.sha256"

      - name: Attest official public build
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.metadata.outputs.zip_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/${{ steps.metadata.outputs.zip_name }}
            dist/${{ steps.metadata.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: dist

      - name: Verify release tag
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" \
              --verify-tag --generate-notes --title "TCP Optimiser $GITHUB_REF_NAME"
          fi
