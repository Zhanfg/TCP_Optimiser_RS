name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-host-${{ hashFiles('Cargo.lock') }}

      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo test --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings

      - name: Validate WebUI and release metadata
        run: |
          find webroot/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node scripts/validate-webui.mjs
          node scripts/validate-release.mjs
          python3 -m py_compile scripts/merge-kernel-modules.py scripts/audit-gki-symbols.py scripts/audit-module-exports.py scripts/expand-vmlinux-symvers.py

      - name: Validate module scripts
        run: |
          bash -n customize.sh post-fs-data.sh service.sh uninstall.sh scripts/package-module.sh scripts/validate-package.sh scripts/build-kernel-modules.sh scripts/fetch-gki-prebuilt.sh scripts/smoke-gki-prebuilt.sh
          shellcheck customize.sh post-fs-data.sh service.sh uninstall.sh scripts/package-module.sh scripts/validate-package.sh scripts/build-kernel-modules.sh scripts/fetch-gki-prebuilt.sh scripts/smoke-gki-prebuilt.sh

  build-android:
    name: Build ${{ matrix.abi }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            machine: AArch64
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            machine: ARM
          - target: x86_64-linux-android
            abi: x86_64
            machine: X86-64
    env:
      TCP_OPTIMISER_OFFICIAL_BUILD: '1'
      TCP_OPTIMISER_BUILD_REPOSITORY: ${{ github.repository }}
      TCP_OPTIMISER_BUILD_REVISION: ${{ github.sha }}
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/_/TCP_Optimiser_RS -C debuginfo=0
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Select pinned Android NDK
        shell: bash
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          if [ ! -d "$NDK_HOME" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ANDROID_NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Verify Android ELF
        run: |
          binary="target/${{ matrix.target }}/release/tcp_optimiser"
          test -s "$binary"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all "$binary"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$binary" | tee elf-header.txt
          grep -F "Machine:" elf-header.txt | grep -F "${{ matrix.machine }}"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings" "$binary" | grep -F "https://github.com/${GITHUB_REPOSITORY}"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strings" "$binary" | grep -F "$GITHUB_SHA"
          install -Dm755 "$binary" "artifact/bin/${{ matrix.abi }}/tcp_optimiser"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.abi }}
          path: artifact
          if-no-files-found: error
          retention-days: 7

  build-kernel-modules:
    name: Kernel modules ${{ matrix.kmi }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1024M
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.15
          - android14-6.1
          - android15-6.6
    steps:
      - uses: actions/checkout@v7

      - id: cache_key
        name: Resolve compiler cache key
        shell: bash
        run: |
          set -euo pipefail
          kernel_rev=$(python3 - scripts/gki-release-pins.json "${{ matrix.kmi }}" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))["targets"][sys.argv[2]]["sha1"])
          PY
          )
          test -n "$kernel_rev"
          clang_id=$(clang --version | head -1 | sha256sum | awk '{print $1}')
          echo "kernel_rev=$kernel_rev" >> "$GITHUB_OUTPUT"
          echo "clang_id=$clang_id" >> "$GITHUB_OUTPUT"

      - id: preflight_cache
        if: ${{ false }}
        name: Restore KMI compatibility result
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.kmi-preflight/${{ matrix.kmi }}
          key: ${{ runner.os }}-kmi-preflight-v2-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt', 'scripts/build-kernel-modules.sh', 'scripts/audit-gki-symbols.py', 'scripts/gki-release-pins.json', 'scripts/fetch-gki-prebuilt.sh') }}
          save-always: true

      - name: Stop immediately on cached KMI rejection
        if: ${{ false }}
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/.kmi-preflight/${{ matrix.kmi }}/report.json"
          test -s "$report"
          python3 - "$report" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          bad = [m for m in data["modules"] if not m["compatible"]]
          print(f"cached checked={len(data['modules'])} incompatible={len(bad)}")
          for item in bad:
              print(item["file"], ", ".join(item["non_kmi_symbols"]))
          if bad:
              raise SystemExit("cached KMI compatibility result rejects this bundle")
          PY

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            bison build-essential ccache clang curl flex git kmod libelf-dev libssl-dev \
            lld llvm pahole python3 rsync

      - name: Restore paired kernel cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.paired-kernel/${{ matrix.kmi }}
          key: ${{ runner.os }}-paired-kernel-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt', 'scripts/gki-release-pins.json', 'scripts/build-kernel-modules.sh') }}
          save-always: true

      - name: Restore BBR3 API probe cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.bbr3-probe/${{ matrix.kmi }}
          key: ${{ runner.os }}-bbr3-probe-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-c5c5575-${{ hashFiles('scripts/kernel-module-config.txt') }}
          save-always: true

      - name: Restore ThinLTO cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.thinlto/${{ matrix.kmi }}
          key: ${{ runner.os }}-gki-thinlto-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt') }}
          restore-keys: |
            ${{ runner.os }}-gki-thinlto-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.clang_id }}-
          save-always: true

      - name: Restore kernel compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/build-kernel-modules.sh') }}
          restore-keys: |
            ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-
            ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-
          save-always: true

      - name: Configure ccache
        run: |
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config compression=true
          ccache --zero-stats

      - name: Build paired GKI Image and modules
        env:
          PAIRED_KERNEL_CACHE: ${{ github.workspace }}/.paired-kernel/${{ matrix.kmi }}
          KERNEL_THINLTO_CACHE: ${{ github.workspace }}/.thinlto/${{ matrix.kmi }}
          BBR_KCONFIG_CACHE: ${{ github.workspace }}/.bbr3-probe/${{ matrix.kmi }}/kernel_config.h
          TCP_OPTIMISER_PAIRED_KERNEL_BUNDLE: "1"
          TCP_OPTIMISER_KMI_PREFLIGHT: "0"
          TCP_OPTIMISER_OFFICIAL_GKI: "0"
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-kernel-modules.sh "${{ matrix.kmi }}" kernel_modules \
            2>&1 | tee "paired-build-${{ matrix.kmi }}.log"

      - name: Upload paired build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-build-log-${{ matrix.kmi }}
          path: paired-build-${{ matrix.kmi }}.log
          if-no-files-found: warn
          retention-days: 7

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Verify generated bundle
        run: |
          test -s kernel_modules/manifest.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path("kernel_modules")
          data = json.loads((root / "manifest.json").read_text())
          expected = {
              "tcp_bbr", "tcp_bbr3",
              "sch_fq", "sch_codel", "sch_fq_codel",
              "sch_cake", "sch_pie", "sch_fq_pie",
          }
          actual = {entry["name"] for entry in data["modules"]}
          builtins = set(data.get("builtin_capabilities", []))
          unavailable = set(data.get("unavailable_capabilities", []))
          missing = sorted(expected - actual - builtins - unavailable)
          if missing:
              raise SystemExit(f"unclassified missing capabilities: {missing}")
          if "tcp_bbr3" not in actual:
              raise SystemExit("tcp_bbr3 must be a shipped KO")
          release = data.get("kernel_release")
          if not release:
              raise SystemExit("missing exact kernel_release")
          if data.get("scope") != "paired-kernel" or not data.get("requires_paired_kernel"):
              raise SystemExit("bundle is not marked as paired-kernel")
          paired = root / "paired_kernel" / "${{ matrix.kmi }}"
          for required in ("Image", "Module.symvers", "kernel.release"):
              if not (paired / required).is_file():
                  raise SystemExit(f"missing paired kernel artifact: {required}")
          if (paired / "kernel.release").read_text().strip() != release:
              raise SystemExit("paired kernel release does not match KO manifest")
          for entry in data["modules"]:
              if entry.get("kernel_release") != release:
                  raise SystemExit(f"module is not exact-release pinned: {entry['name']}")
              path = root / entry["file"]
              if not path.is_file():
                  raise SystemExit(f"missing module: {entry['file']}")
              if hashlib.sha256(path.read_bytes()).hexdigest() != entry["sha256"]:
                  raise SystemExit(f"hash mismatch: {entry['file']}")
          print(f"modules={len(actual)} builtins={len(builtins)}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-modules-${{ matrix.kmi }}-arm64
          path: kernel_modules
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: paired-kernel-${{ matrix.kmi }}-arm64
          path: |
            kernel_modules/paired_kernel/${{ matrix.kmi }}/Image
            kernel_modules/paired_kernel/${{ matrix.kmi }}/Module.symvers
            kernel_modules/paired_kernel/${{ matrix.kmi }}/kernel.release
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  package:
    name: Assemble module
    if: ${{ always() && needs.validate.result == 'success' && needs.build-android.result == 'success' && (needs.build-kernel-modules.result == 'success' || needs.build-kernel-modules.result == 'skipped') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [validate, build-android, build-kernel-modules]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      zip_name: ${{ steps.metadata.outputs.zip_name }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binary-input
          merge-multiple: true

      - uses: actions/download-artifact@v8
        if: needs.build-kernel-modules.result == 'success'
        with:
          pattern: kernel-modules-*
          path: kernel-module-input

      - name: Merge kernel module bundles
        if: needs.build-kernel-modules.result == 'success'
        run: |
          rm -rf kernel_modules
          python3 scripts/merge-kernel-modules.py kernel-module-input kernel_modules
          test -s kernel_modules/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("kernel_modules/manifest.json").read_text())
          expected = {
              "tcp_bbr", "tcp_bbr3",
              "sch_fq", "sch_codel", "sch_fq_codel",
              "sch_cake", "sch_pie", "sch_fq_pie",
          }
          modules_by_kmi = {}
          for module in data.get("modules", []):
              modules_by_kmi.setdefault(module["kmi"], set()).add(module["name"])
          for build in data.get("builds", []):
              kmi = build["kmi"]
              builtins = set(build.get("builtin_capabilities", []))
              unavailable = set(build.get("unavailable_capabilities", []))
              actual = modules_by_kmi.get(kmi, set())
              missing = sorted(expected - actual - builtins - unavailable)
              if missing:
                  raise SystemExit(f"{kmi}: unclassified missing capabilities: {missing}")
              if "tcp_bbr3" not in actual:
                  raise SystemExit(f"{kmi}: missing shipped tcp_bbr3 KO")
              release = build.get("kernel_release")
              if not release:
                  raise SystemExit(f"{kmi}: missing exact kernel_release")
              for module in data.get("modules", []):
                  if module["kmi"] == kmi and module.get("kernel_release") != release:
                      raise SystemExit(f"{kmi}: module not pinned to exact release: {module['name']}")
          print(f"validated {len(data.get('builds', []))} merged KMI builds")
          PY

      - id: metadata
        name: Resolve package metadata
        shell: bash
        run: |
          version=$(sed -n 's/^version=//p' module.prop | head -n1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_name=TCP_Optimiser_RS-v$version.zip" >> "$GITHUB_OUTPUT"
          echo "artifact_name=TCP_Optimiser_RS-v$version-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build reproducible module ZIP
        env:
          MODULE_SIGNING_KEY: ${{ secrets.MODULE_SIGNING_KEY }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          bash scripts/package-module.sh "dist/${{ steps.metadata.outputs.zip_name }}" binary-input/bin
          bash scripts/validate-package.sh "dist/${{ steps.metadata.outputs.zip_name }}"
          cd dist
          sha256sum "${{ steps.metadata.outputs.zip_name }}" > "${{ steps.metadata.outputs.zip_name }}.sha256"

      - name: Attest official public build
        if: github.event.repository.visibility == 'public' && github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ steps.metadata.outputs.zip_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/${{ steps.metadata.outputs.zip_name }}
            dist/${{ steps.metadata.outputs.zip_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: dist

      - name: Verify release tag
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: test "$GITHUB_REF_NAME" = "v$VERSION"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIP_NAME: ${{ needs.package.outputs.zip_name }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/$ZIP_NAME" "dist/$ZIP_NAME.sha256" \
              --verify-tag --generate-notes --title "TCP Optimiser $GITHUB_REF_NAME"
          fi
