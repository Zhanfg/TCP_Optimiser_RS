name: Kernel modules

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/kernel_module.rs'
      - 'scripts/build-kernel-modules.sh'
      - 'scripts/kernel-module-config.txt'
      - 'scripts/audit-gki-symbols.py'
      - 'scripts/audit-module-exports.py'
      - 'kernel/**'
      - '.github/workflows/kernel-modules.yml'

concurrency:
  group: kernel-modules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.kmi }} arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1024M
      CCACHE_COMPRESS: "true"
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.15
          - android14-6.1
          - android15-6.6
    steps:
      - uses: actions/checkout@v7

      - id: cache_key
        name: Resolve compiler cache key
        shell: bash
        run: |
          set -euo pipefail
          kernel_rev=$(git ls-remote https://android.googlesource.com/kernel/common "refs/heads/${{ matrix.kmi }}" | awk 'NR==1{print $1}')
          test -n "$kernel_rev"
          clang_id=$(clang --version | head -1 | sha256sum | awk '{print $1}')
          echo "kernel_rev=$kernel_rev" >> "$GITHUB_OUTPUT"
          echo "clang_id=$clang_id" >> "$GITHUB_OUTPUT"

      - id: preflight_cache
        name: Restore KMI compatibility result
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.kmi-preflight/${{ matrix.kmi }}
          key: ${{ runner.os }}-kmi-preflight-v2-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt', 'scripts/build-kernel-modules.sh', 'scripts/audit-gki-symbols.py') }}
          save-always: true

      - name: Stop immediately on cached KMI rejection
        if: steps.preflight_cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/.kmi-preflight/${{ matrix.kmi }}/report.json"
          test -s "$report"
          python3 - "$report" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          bad = [m for m in data["modules"] if not m["compatible"]]
          print(f"cached checked={len(data['modules'])} incompatible={len(bad)}")
          for item in bad:
              print(item["file"], ", ".join(item["non_kmi_symbols"]))
          if bad:
              raise SystemExit("cached KMI compatibility result rejects this bundle")
          PY

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc binutils binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            bison build-essential ccache clang flex git kmod libelf-dev libssl-dev \
            lld llvm pahole python3 rsync

      - name: Restore exact GKI Module.symvers
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.kernel-symvers/${{ matrix.kmi }}
          key: ${{ runner.os }}-gki-symvers-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt') }}
          save-always: true

      - name: Restore BBR3 API probe cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.bbr3-probe/${{ matrix.kmi }}
          key: ${{ runner.os }}-bbr3-probe-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-c5c5575-${{ hashFiles('scripts/kernel-module-config.txt') }}
          save-always: true

      - name: Restore ThinLTO cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.thinlto/${{ matrix.kmi }}
          key: ${{ runner.os }}-gki-thinlto-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/kernel-module-config.txt') }}
          restore-keys: |
            ${{ runner.os }}-gki-thinlto-v1-${{ matrix.kmi }}-${{ steps.cache_key.outputs.clang_id }}-
          save-always: true

      - name: Restore kernel compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-${{ hashFiles('scripts/build-kernel-modules.sh') }}
          restore-keys: |
            ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-${{ steps.cache_key.outputs.kernel_rev }}-${{ steps.cache_key.outputs.clang_id }}-
            ${{ runner.os }}-gki-ccache-${{ matrix.kmi }}-
          save-always: true

      - name: Configure ccache
        run: |
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --set-config compression=true
          ccache --zero-stats

      - name: Build loadable GKI modules
        env:
          KERNEL_SYMVERS_CACHE: ${{ github.workspace }}/.kernel-symvers/${{ matrix.kmi }}/Module.symvers
          KERNEL_THINLTO_CACHE: ${{ github.workspace }}/.thinlto/${{ matrix.kmi }}
          BBR_KCONFIG_CACHE: ${{ github.workspace }}/.bbr3-probe/${{ matrix.kmi }}/kernel_config.h
          TCP_OPTIMISER_PREFLIGHT_CACHE: ${{ github.workspace }}/.kmi-preflight/${{ matrix.kmi }}/report.json
        run: bash scripts/build-kernel-modules.sh "${{ matrix.kmi }}" kernel_modules

      - name: Show compiler cache stats
        if: always()
        run: ccache --show-stats || true

      - name: Validate module bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s kernel_modules/manifest.json
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('kernel_modules')
          data = json.loads((root / 'manifest.json').read_text())
          expected = {
              'tcp_bbr', 'tcp_bbr3',
              'sch_fq', 'sch_codel', 'sch_fq_codel',
              'sch_cake', 'sch_pie', 'sch_fq_pie',
          }
          actual = {entry['name'] for entry in data['modules']}
          missing = sorted(expected - actual)
          if missing:
              raise SystemExit(f'missing modules: {missing}')
          for entry in data['modules']:
              path = root / entry['file']
              if not path.is_file():
                  raise SystemExit(f"missing file: {entry['file']}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != entry['sha256']:
                  raise SystemExit(f"hash mismatch: {entry['file']}")
          print(f"validated {len(actual)} kernel modules")
          PY
          find kernel_modules -name '*.ko' -print -exec file {} \;
          sha256sum kernel_modules/"${{ matrix.kmi }}"/aarch64/*.ko
          modinfo kernel_modules/"${{ matrix.kmi }}"/aarch64/tcp_bbr3.ko | sed -n '1,20p'

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-modules-${{ matrix.kmi }}-arm64
          path: kernel_modules
          if-no-files-found: error
          retention-days: 30
