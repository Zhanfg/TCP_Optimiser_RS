name: BBRv2 provider research

on:
  pull_request:
    paths:
      - 'src/bbr2.rs'
      - 'experiments/bbr2-provider/**'
      - 'scripts/build-bbr2-structops-probe.sh'
      - '.github/workflows/bbr2-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-structops-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install BPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc libbpf-dev linux-tools-common linux-tools-generic llvm
          bpftool_bin=$(find /usr/lib -maxdepth 3 -type f -name bpftool -perm -111 2>/dev/null | sort -V | tail -n1)
          test -x "$bpftool_bin"
          echo "BPFTOOL=$bpftool_bin" >> "$GITHUB_ENV"

      - name: Compile minimal CO-RE struct_ops probe
        run: bash scripts/build-bbr2-structops-probe.sh out/bbr2-provider

      - name: Inspect payload
        shell: bash
        run: |
          set -euo pipefail
          obj=out/bbr2-provider/tcpopt_structops_probe.bpf.o
          file "$obj"
          llvm-readelf -S "$obj"
          bytes=$(stat -c %s "$obj")
          echo "Stripped probe payload: $bytes bytes"
          test "$bytes" -lt 131072

      - name: Exercise host struct_ops verifier
        shell: bash
        run: |
          set -euo pipefail
          obj=out/bbr2-provider/tcpopt_structops_probe.bpf.o
          if ! sudo "$BPFTOOL" struct_ops help >/dev/null 2>&1; then
            echo "Host bpftool has no struct_ops support; compile-only result retained."
            exit 0
          fi

          trap 'sudo "$BPFTOOL" struct_ops unregister name tcpopt_probe >/dev/null 2>&1 || true' EXIT
          set +e
          output=$(sudo "$BPFTOOL" -d struct_ops register "$obj" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            echo "Host kernel rejected runtime registration; Android target validation is still required."
            exit 0
          fi

          sudo "$BPFTOOL" struct_ops show
          sudo "$BPFTOOL" struct_ops show | grep -F tcpopt_probe
          echo "Host kernel accepted tcpopt_probe struct_ops registration."

      - uses: actions/upload-artifact@v7
        with:
          name: bbr2-structops-probe
          path: out/bbr2-provider/tcpopt_structops_probe.bpf.o
          if-no-files-found: error
          retention-days: 7
