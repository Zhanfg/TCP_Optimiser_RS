name: BBRv2 provider research

on:
  pull_request:
    paths:
      - 'src/bbr2.rs'
      - 'experiments/bbr2-provider/**'
      - 'scripts/build-bbr2-structops-probe.sh'
      - '.github/workflows/bbr2-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-structops-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install BPF build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc libbpf-dev libelf-dev linux-tools-common linux-tools-generic llvm pkg-config zlib1g-dev libzstd-dev
          bpftool_bin=$(find /usr/lib -maxdepth 3 -type f -name bpftool -perm -111 2>/dev/null | sort -V | tail -n1)
          test -x "$bpftool_bin"
          echo "BPFTOOL=$bpftool_bin" >> "$GITHUB_ENV"

      - name: Compile minimal CO-RE struct_ops probe
        run: bash scripts/build-bbr2-structops-probe.sh out/bbr2-provider

      - name: Inspect payload
        shell: bash
        run: |
          set -euo pipefail
          obj=out/bbr2-provider/tcpopt_structops_probe.bpf.o
          file "$obj"
          llvm-readelf -S "$obj"
          bytes=$(stat -c %s "$obj")
          echo "Stripped probe payload: $bytes bytes"
          test "$bytes" -lt 131072

      - name: Exercise host struct_ops verifier
        shell: bash
        run: |
          set -euo pipefail
          obj=out/bbr2-provider/tcpopt_structops_probe.bpf.o
          if ! sudo "$BPFTOOL" struct_ops help >/dev/null 2>&1; then
            echo "Host bpftool has no struct_ops support; compile-only result retained."
            exit 0
          fi

          trap 'sudo "$BPFTOOL" struct_ops unregister name tcpopt_probe >/dev/null 2>&1 || true' EXIT
          set +e
          output=$(sudo "$BPFTOOL" -d struct_ops register "$obj" 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output"
          if [ "$rc" -ne 0 ]; then
            echo "Host kernel rejected runtime registration; Android target validation is still required."
            exit 0
          fi

          sudo "$BPFTOOL" struct_ops show
          sudo "$BPFTOOL" struct_ops show | grep -F tcpopt_probe
          echo "Host kernel accepted tcpopt_probe struct_ops registration."

      - name: Generate light skeleton experiment
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          obj=out/bbr2-provider/tcpopt_structops_probe.bpf.o
          header=out/bbr2-provider/tcpopt_structops_probe.lskel.h

          "$BPFTOOL" gen skeleton -L "$obj" > "$header"
          test -s "$header"
          bytes=$(stat -c %s "$header")
          echo "Light skeleton header: $bytes bytes"

          echo "Generated lifecycle/API symbols:"
          grep -oE 'tcpopt_structops_probe__[A-Za-z0-9_]+' "$header" | sort -u || true
          echo "Generated struct_ops references:"
          grep -nE 'struct_ops|tcpopt_probe|load_and_run|attach' "$header" | head -120 || true

      - name: Build minimal struct_ops loader and measure payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bbr2-provider
          cflags="-Os -ffunction-sections -fdata-sections"
          ldflags="-Wl,--gc-sections -s"

          gcc $cflags experiments/bbr2-provider/structops_loader.c \
            -o out/bbr2-provider/tcpopt_structops_loader \
            $ldflags $(pkg-config --cflags --libs libbpf)

          dynamic_bytes=$(stat -c %s out/bbr2-provider/tcpopt_structops_loader)
          echo "Dynamic libbpf loader: $dynamic_bytes bytes"

          if gcc $cflags experiments/bbr2-provider/structops_loader.c \
              -o out/bbr2-provider/tcpopt_structops_loader.static \
              $ldflags -static $(pkg-config --cflags --libs --static libbpf) 2>out/bbr2-provider/static-loader.log; then
            static_bytes=$(stat -c %s out/bbr2-provider/tcpopt_structops_loader.static)
            echo "Static libbpf loader: $static_bytes bytes"
          else
            echo "Static loader unavailable with runner packages; keeping this as a size experiment."
            cat out/bbr2-provider/static-loader.log
            rm -f out/bbr2-provider/tcpopt_structops_loader.static
          fi

      - name: Host-kernel attach probe
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo out/bbr2-provider/tcpopt_structops_loader \
            out/bbr2-provider/tcpopt_structops_probe.bpf.o

      - uses: actions/upload-artifact@v7
        with:
          name: bbr2-structops-probe
          path: |
            out/bbr2-provider/tcpopt_structops_probe.bpf.o
            out/bbr2-provider/tcpopt_structops_probe.lskel.h
            out/bbr2-provider/tcpopt_structops_loader
            out/bbr2-provider/tcpopt_structops_loader.static
            out/bbr2-provider/static-loader.log
          if-no-files-found: error
          retention-days: 7
